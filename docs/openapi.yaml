openapi: 3.0.3
info:
  title: deckard API
  version: 1.0.0
  description: |
    REST + SSE API of deckard, the attack-surface monitor.

    Authentication depends on `auth.mode`:
    * `none` - no authentication; read AND write are open. Only run behind a trusted authenticating proxy.
    * `token` - `Authorization: Bearer <token>` on every request except `/healthz` and `/readyz`. The token is never accepted in the query string.
    * `oidc` - browser login via `/auth/login` (Authorization Code + PKCE) and a signed, encrypted session cookie.
      State-changing requests authenticated by cookie must send the `X-CSRF-Token` header with the value returned by `GET /api/v1/me`.

    List responses are `{items,total,limit,offset}`; `limit` defaults to 50 (max 500). Unknown or malformed query parameters yield 400.
    Errors are `{"error":{"code","message"}}`.
servers:
  - url: /
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is serving
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
  /readyz:
    get:
      summary: Readiness probe (database reachable)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        '503':
          description: Store unreachable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
  /auth/login:
    get:
      summary: Start OIDC login (oidc mode only)
      security: []
      parameters:
        - name: next
          in: query
          description: Same-site path to return to after login
          schema: {type: string}
      responses:
        '302': {description: Redirect to the identity provider}
        '502': {$ref: '#/components/responses/Error'}
  /auth/callback:
    get:
      summary: OIDC redirect URI (oidc mode only)
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302': {description: Session established; redirect to the original page}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      summary: End the session (oidc mode only)
      description: |
        POST only (a GET would be triggerable cross-site). With a live session the
        `X-CSRF-Token` header (from `GET /api/v1/me` `csrf_token`) is required.
      security: []
      parameters:
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      responses:
        '303': {description: Cookie cleared; redirect to /}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      summary: Current identity and capabilities
      responses:
        '200':
          description: Identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/openapi.yaml:
    get:
      summary: This document
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/stats:
    get:
      summary: Dashboard summary
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stats'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/assets:
    get:
      summary: List assets
      parameters:
        - {name: kind, in: query, schema: {$ref: '#/components/schemas/AssetKind'}}
        - {name: source, in: query, schema: {type: string}}
        - {name: scope, in: query, schema: {$ref: '#/components/schemas/ScopeClass'}}
        - {name: zone, in: query, schema: {type: string}}
        - {name: q, in: query, description: Substring match on key, schema: {type: string}}
        - {name: include_removed, in: query, schema: {type: boolean, default: false}}
        - name: open_min_severity
          in: query
          description: Only assets with an open finding at or above this severity; sorted by worst severity, open count, then key.
          schema: {$ref: '#/components/schemas/Severity'}
        - name: include_summary
          in: query
          description: Add open_findings, top_severity, and the latest recorded scan attempt as last_scan to every asset in this page.
          schema: {type: boolean, default: false}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Page of assets
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ListEnvelope'}
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Asset'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/assets/{id}:
    get:
      summary: Asset detail with edges, latest observations, baselines and open findings
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200':
          description: Asset detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetDetail'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/assets/{id}/graph:
    get:
      summary: Neighbourhood graph for the UI
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: depth, in: query, schema: {type: integer, minimum: 1, maximum: 3, default: 1}}
      responses:
        '200':
          description: Nodes and edges
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Graph'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/assets/{id}/rescan:
    post:
      summary: Queue an immediate rescan of one asset
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
  /api/v1/findings:
    get:
      summary: List findings
      description: |
        Filters and sorting apply to the full result before pagination. Set group_by
        without group_key to page aggregate FindingGroup objects instead of findings.
        Group totals and severity counts cover the complete filtered set. Set group_key
        (including an empty string for the no-zone group) to page that group's findings.
        Groups sort by worst severity, count, then key; sort=count orders groups by count,
        then key. Finding sorts use stable ID tie-breakers. attention selects open high,
        critical, or KEV findings; sort=attention ranks takeover, expiry, severity, KEV,
        then oldest first. Responses remain bounded by limit in every mode.
      parameters:
        - name: status
          in: query
          description: Repeatable
          style: form
          explode: true
          schema:
            type: array
            items: {$ref: '#/components/schemas/FindingStatus'}
        - {name: min_severity, in: query, schema: {$ref: '#/components/schemas/Severity'}}
        - {name: severity, in: query, description: Exact severity, schema: {$ref: '#/components/schemas/Severity'}}
        - {name: check, in: query, schema: {type: string}}
        - {name: zone, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string}}
        - {name: asset_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: q, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [severity, last_seen, first_seen, attention, count], default: severity}}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: group_by, in: query, schema: {type: string, enum: [asset, check, zone]}}
        - {name: group_key, in: query, description: Requires group_by; selects members rather than group aggregates, allowEmptyValue: true, schema: {type: string, maxLength: 8192}}
        - {name: attention, in: query, schema: {type: boolean, default: false}}
        - {name: first_seen_after, in: query, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Page of findings
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ListEnvelope'}
                  - type: object
                    properties:
                      items:
                        anyOf:
                          - {type: array, items: {$ref: '#/components/schemas/Finding'}}
                          - {type: array, items: {$ref: '#/components/schemas/FindingGroup'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/findings/{id}:
    get:
      summary: Finding detail
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200':
          description: Finding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Finding'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/findings/{id}/acknowledge:
    post:
      summary: Acknowledge a finding (optionally until a time)
      parameters:
        - {$ref: '#/components/parameters/ID'}
      requestBody: {$ref: '#/components/requestBodies/FindingAction'}
      responses:
        '200':
          description: Updated finding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Finding'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /api/v1/findings/{id}/suppress:
    post:
      summary: Suppress a finding; note required, until optional
      parameters:
        - {$ref: '#/components/parameters/ID'}
      requestBody: {$ref: '#/components/requestBodies/FindingAction'}
      responses:
        '200':
          description: Updated finding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Finding'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /api/v1/findings/{id}/false-positive:
    post:
      summary: Mark a finding as a false positive
      parameters:
        - {$ref: '#/components/parameters/ID'}
      requestBody: {$ref: '#/components/requestBodies/FindingAction'}
      responses:
        '200':
          description: Updated finding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Finding'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /api/v1/findings/{id}/reopen:
    post:
      summary: Reopen an acknowledged, suppressed or false-positive finding
      parameters:
        - {$ref: '#/components/parameters/ID'}
      requestBody: {$ref: '#/components/requestBodies/FindingAction'}
      responses:
        '200':
          description: Updated finding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Finding'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /api/v1/sources:
    get:
      summary: Source sync status
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Page of source statuses
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ListEnvelope'}
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/SyncStatus'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/sources/{name}/sync:
    post:
      summary: Trigger a sync of one source
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
  /api/v1/ingest:
    post:
      summary: Ingest findings from an external scanner
      description: |
        Posts one run of an external scanner (Prowler, Kubescape, trufflehog, gitleaks, s3scanner, any SARIF producer; see
        `deckard ingest` and docs/ingest.md) for one `(tool, scope)`. Findings are stored under check `ext.<tool>` with
        source `ingest:<tool>` and follow the normal lifecycle (dedup, open/resolved, acknowledge/suppress, Alertmanager,
        metrics). deckard never probes anything an ingest names.

        Requires a write-capable identity (the same rule as acknowledge/suppress; cookie sessions must send
        `X-CSRF-Token`). The body is at most 10 MiB and parsed strictly (unknown fields are 400). A request that fails
        validation is rejected whole with 422 and changes nothing.

        Reconciliation: a request with `complete: true` is the full truth for its `(tool, scope)`, so previously ingested
        findings of that pair that are absent accrue a miss and resolve after `findings.resolve_after` consecutive
        complete misses, exactly like a built-in check. Absence is applied only when the request is complete, no item was
        rejected (an `asset.ref` that does not name a live owned asset rejects the item and is reported in `rejected`)
        and `observed_at` is newer than every run already accepted for the pair; otherwise the request only opens,
        reopens and refreshes, and `complete` in the response is false with a `note`. Re-posting the last accepted body is
        a no-op (`replay: true`). Requests for one pair are serialised.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IngestRequest'}
      responses:
        '200':
          description: Applied (possibly with rejected items, see `rejected` and `complete`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403':
          description: CSRF token missing (cookie sessions) or ingest disabled (`ingest.enabled`; code `ingest_disabled`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422':
          description: Validation failed; nothing was changed. `rejected` lists every problem (index -1 is the request itself).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestError'}
        '429':
          description: Per-identity rate limit (`ingest.rate_limit`) or too many concurrent ingests; see `Retry-After`
          headers:
            Retry-After: {schema: {type: integer}, description: Seconds to wait}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501': {$ref: '#/components/responses/Error'}
  /api/v1/scans:
    get:
      summary: Recent scan runs
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Page of scan runs (total is the number of rows within the requested window)
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ListEnvelope'}
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/ScanRun'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/changes:
    get:
      summary: Inventory and finding change feed
      parameters:
        - {name: since, in: query, description: RFC3339 timestamp; default 24h ago, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ListEnvelope'}
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Event'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/events:
    get:
      summary: Server-sent change stream
      description: |
        Emits `event: change` with a JSON `Event` as data and the event id as the SSE id.
        Resume with `Last-Event-ID` (replays up to 24h; `?since=` older than that is clamped) or `?since=`. Heartbeat comments every 15s.
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: Last-Event-ID, in: header, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '429':
          description: Too many open streams (global cap, default 100, or per identity, default 10). Retry after the `Retry-After` seconds.
          headers:
            Retry-After: {schema: {type: integer}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: __Host-deckard_session, description: "Unprefixed deckard_session when base_url is not https"}
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
  requestBodies:
    FindingAction:
      required: false
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ActionRequest'}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Status: {type: object, properties: {status: {type: string}}}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    ListEnvelope:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: {type: array, items: {}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
    Me:
      type: object
      properties:
        subject: {type: string}
        name: {type: string}
        email: {type: string}
        groups: {type: array, items: {type: string}}
        auth_mode: {type: string, enum: [none, token, oidc]}
        method: {type: string, enum: [none, token, cookie]}
        can_write: {type: boolean}
        csrf_token: {type: string, description: Present for cookie sessions}
    AssetKind: {type: string, enum: [zone, hostname, ip, service, url, certificate, cloud_resource]}
    ScopeClass: {type: string, enum: [owned, shared, external, excluded]}
    Severity: {type: string, enum: [info, low, medium, high, critical]}
    FindingStatus: {type: string, enum: [open, acknowledged, suppressed, false_positive, resolved]}
    Asset:
      type: object
      properties:
        id: {type: integer, format: int64}
        kind: {$ref: '#/components/schemas/AssetKind'}
        key: {type: string}
        source: {type: string}
        scope: {$ref: '#/components/schemas/ScopeClass'}
        zone: {type: string}
        attrs: {type: object, additionalProperties: true}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        removed_at: {type: string, format: date-time, nullable: true}
        open_findings: {type: integer, description: Present when include_summary=true; all open findings for this asset}
        top_severity: {$ref: '#/components/schemas/Severity'}
        last_scan: {type: string, format: date-time, nullable: true, description: Present when include_summary=true; survives scan-history retention}
    FindingGroup:
      type: object
      required: [key, label, total, counts, top]
      properties:
        key: {type: string}
        label: {type: string}
        total: {type: integer}
        counts:
          type: object
          additionalProperties: {type: integer}
        top: {$ref: '#/components/schemas/Severity'}
    AssetDetail:
      type: object
      properties:
        asset: {$ref: '#/components/schemas/Asset'}
        edges:
          type: array
          items:
            type: object
            properties:
              direction: {type: string, enum: [out, in]}
              type: {type: string}
              asset: {$ref: '#/components/schemas/Asset'}
        observations:
          type: array
          items:
            type: object
            properties:
              asset_id: {type: integer, format: int64}
              check: {type: string}
              data: {type: object, additionalProperties: true}
              observed_at: {type: string, format: date-time}
        baselines:
          type: array
          items:
            type: object
            properties:
              check: {type: string}
              data: {type: object, additionalProperties: true}
              stable: {type: boolean}
              consistent: {type: integer}
              updated_at: {type: string, format: date-time}
        findings: {type: array, items: {$ref: '#/components/schemas/Finding'}}
    Graph:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              id: {type: integer, format: int64}
              kind: {$ref: '#/components/schemas/AssetKind'}
              key: {type: string}
              scope: {$ref: '#/components/schemas/ScopeClass'}
        edges:
          type: array
          items:
            type: object
            properties:
              from: {type: integer, format: int64}
              to: {type: integer, format: int64}
              type: {type: string}
        truncated: {type: boolean}
    Finding:
      type: object
      properties:
        id: {type: integer, format: int64}
        fingerprint: {type: string}
        check: {type: string}
        asset_id: {type: integer, format: int64}
        asset_key: {type: string}
        zone: {type: string}
        source: {type: string}
        severity: {$ref: '#/components/schemas/Severity'}
        title: {type: string}
        description: {type: string}
        evidence: {type: object, additionalProperties: true}
        remediation: {type: string}
        tags: {type: array, items: {type: string}}
        status: {$ref: '#/components/schemas/FindingStatus'}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time, nullable: true}
        missed_runs: {type: integer}
        reopened_count: {type: integer}
        suppressed_until: {type: string, format: date-time, nullable: true}
        suppression_note: {type: string}
        ingest_scope: {type: string, description: 'Scope an ingested finding (check ext.<tool>) was reported for; absent for built-in checks'}
    IngestRequest:
      type: object
      additionalProperties: false
      required: [tool, scope, observed_at, findings]
      properties:
        tool: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,31}$', description: 'Producer name; findings are stored under check ext.<tool>'}
        scope: {type: string, minLength: 1, maxLength: 200, description: 'What was scanned (aws:<account>:<region>, a cluster, a GitHub org); findings reconcile per (tool, scope)'}
        complete: {type: boolean, default: false, description: 'true asserts findings is everything the tool found in scope, so absent findings may resolve'}
        observed_at: {type: string, format: date-time, description: 'When the run happened; identifies the run (no more than 5 minutes in the future)'}
        findings: {type: array, maxItems: 5000, items: {$ref: '#/components/schemas/IngestFinding'}, description: 'Required; [] is an empty run. ingest.tools.<tool>.max_findings may lower the limit.'}
    IngestFinding:
      type: object
      additionalProperties: false
      required: [key, asset, title, description, severity]
      properties:
        key: {type: string, minLength: 1, maxLength: 512, description: 'Stable producer id, unique within the request; the fingerprint derives from (tool, scope, key)'}
        asset: {$ref: '#/components/schemas/IngestAsset'}
        title: {type: string, minLength: 1, maxLength: 300}
        description: {type: string, minLength: 1, maxLength: 8000}
        severity: {$ref: '#/components/schemas/Severity'}
        remediation: {type: string, maxLength: 4000}
        tags: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 64}}
        evidence: {type: object, additionalProperties: true, description: 'At most 16 KiB of JSON, 8 levels deep'}
    IngestAsset:
      type: object
      additionalProperties: false
      description: >-
        Either kind and key (created with source ingest:<tool> when missing; only cloud_resource, a kind deckard never
        probes) or ref (an existing, live, owned asset of any kind, never modified).
      properties:
        kind: {type: string, enum: [cloud_resource]}
        key: {type: string, minLength: 1, maxLength: 512}
        ref:
          type: object
          additionalProperties: false
          required: [kind, key]
          properties:
            kind: {$ref: '#/components/schemas/AssetKind'}
            key: {type: string, minLength: 1, maxLength: 512}
    IngestRejection:
      type: object
      required: [index, reason]
      properties:
        index: {type: integer, description: 'Position in findings; -1 for the request itself'}
        reason: {type: string}
    IngestResponse:
      type: object
      required: [accepted, opened, reopened, refreshed, resolved_pending, resolved, complete, replay, rejected]
      properties:
        accepted: {type: integer, description: Findings applied (not rejected); 0 for a replay}
        opened: {type: integer}
        reopened: {type: integer, description: Resolved findings seen again}
        refreshed: {type: integer, description: Known findings seen again (operator statuses are kept)}
        resolved_pending: {type: integer, description: Absent findings that accrued a miss and resolve after findings.resolve_after consecutive complete misses}
        resolved: {type: integer}
        complete: {type: boolean, description: Whether absence was applied}
        note: {type: string, description: Why a complete request was not applied as complete, or that it was a replay}
        replay: {type: boolean, description: The request repeated the last accepted one for its (tool, scope); nothing changed}
        rejected: {type: array, items: {$ref: '#/components/schemas/IngestRejection'}}
    IngestError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
        rejected: {type: array, items: {$ref: '#/components/schemas/IngestRejection'}}
    ActionRequest:
      type: object
      additionalProperties: false
      properties:
        note: {type: string, maxLength: 2000}
        until: {type: string, format: date-time, nullable: true, description: Must be in the future; only for acknowledge and suppress}
    Stats:
      type: object
      properties:
        assets_by_kind: {type: object, additionalProperties: {type: integer}}
        assets_by_source: {type: object, additionalProperties: {type: integer}}
        assets_by_scope: {type: object, additionalProperties: {type: integer}}
        findings_by_severity: {type: object, additionalProperties: {type: integer}}
        findings_by_check: {type: object, additionalProperties: {type: integer}}
    SyncStatus:
      type: object
      properties:
        source: {type: string}
        type: {type: string}
        last_run: {type: string, format: date-time}
        last_ok: {type: string, format: date-time}
        error: {type: string, description: Present when the last run failed}
        warning:
          type: string
          description: >-
            Present when the last run completed but was partial (for example a
            permission was missing for part of the source). Removals are skipped
            while a source reports a warning, so the inventory may be incomplete.
        asset_count: {type: integer}
        duration_ms: {type: integer, format: int64}
    ScanRun:
      type: object
      properties:
        id: {type: integer, format: int64}
        asset_id: {type: integer, format: int64}
        check: {type: string}
        tier: {type: string}
        started_at: {type: string, format: date-time}
        duration_ms: {type: integer, format: int64}
        error: {type: string}
        findings: {type: integer}
    Event:
      type: object
      properties:
        id: {type: integer, format: int64}
        type: {type: string}
        subject: {type: string}
        data: {type: object, additionalProperties: true}
        at: {type: string, format: date-time}
