name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Builds, pushes, SBOMs, signs and attests each image target. This is the
  # signing job, so it is the only one with id-token: write (keyless cosign via
  # GitHub OIDC) and attestations: write.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [slim, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/deckard
          # "full" is the default (unsuffixed) image; "slim" has no nuclei.
          flavor: |
            suffix=${{ matrix.target == 'slim' && '-slim' || '' }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # SPDX SBOM and SLSA provenance attached to the image index.
          sbom: true
          provenance: mode=max

      - name: image reference (lowercase)
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/deckard" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the signing identity is this workflow run, recorded in the
      # Sigstore transparency log. Sign the digest, not a mutable tag.
      - name: cosign sign
        env:
          IMAGE: ${{ steps.ref.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  runners:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: assessment-zgrab2
            dockerfile: deploy/assessment/Dockerfile.zgrab2
          - name: assessment-zap
            dockerfile: deploy/assessment/Dockerfile.zap
          - name: assessment-strix
            dockerfile: deploy/assessment/Dockerfile.strix
          - name: collector-trivy
            dockerfile: deploy/assessment/Dockerfile.trivy
          - name: collector-kubescape
            dockerfile: deploy/collectors/Dockerfile.kubescape
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve and verify this release's application digest
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          DECKARD_RUNNER_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          # RUNNER_* belongs to GitHub and cannot carry our matrix values.
          [[ "$DECKARD_RUNNER_NAME" =~ ^(assessment-(zgrab2|zap|strix)|collector-(trivy|kubescape))$ ]]
          app="ghcr.io/${OWNER,,}/deckard"
          digest=$(docker buildx imagetools inspect "$app:${GITHUB_REF_NAME#v}-slim" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "base=$app@$digest" >> "$GITHUB_OUTPUT"
          echo "name=$app-$DECKARD_RUNNER_NAME" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: verify application release signer
        env:
          BASE: ${{ steps.ref.outputs.base }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify "$BASE" \
            --certificate-identity "https://github.com/$REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ref.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: DECKARD_IMAGE=${{ steps.ref.outputs.base }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
      - name: sign runner digest
        env:
          IMAGE: ${{ steps.ref.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    runs-on: ubuntu-latest
    needs: [image, runners]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: package and push chart (OCI)
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package deploy/helm/deckard --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          helm push deckard-*.tgz "oci://ghcr.io/${GH_OWNER}/charts"
