name: ci
on:
  # Every branch push runs CI (main is merged via branch + review, so branches
  # must be validated before a PR exists); tags are handled by release.yml.
  push: { branches: ['**'] }
  pull_request:

# Supersede in-flight runs for the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Reachable-vulnerability scanning (govulncheck) lives in govulncheck.yml, which
# also runs on every PR and daily; it is deliberately not duplicated here.

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt drift
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed on:" >&2; echo "$unformatted" >&2; exit 1; fi
      - name: go mod tidy drift
        run: go mod tidy -diff
      - run: go vet ./...
      # Postgres-backed tests use testcontainers (Docker is available on the runner).
      - name: go test
        shell: bash
        env:
          # The runner is ephemeral, so the testcontainers reaper adds nothing but a
          # startup wait that has timed out and failed an otherwise green run.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          set +e
          go test -race -count=1 ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the failures as annotations: they are readable through the
            # public API without downloading (authenticated) job logs.
            grep -E '^(--- FAIL|FAIL|panic:|WARNING: DATA RACE)|_test\.go:[0-9]+:' test.log | head -40 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
          fi
          exit "$status"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned: an unpinned linter floats to `latest`, so new rules turn CI red
          # with no code change. Bump deliberately and fix findings in the same PR.
          version: v2.14.0
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -quiet -exclude-dir=web ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run typecheck && npm test && npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: release runner naming with GitHub reserved environment
        run: python3 -m unittest discover -s deploy/assessment/tests -p test_release_workflow.py -v
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint deploy/helm/deckard --set database.cnpg.enabled=true
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - name: pinned structured YAML parser
        run: |
          curl -fsSL --retry 3 https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 -o yq
          echo '8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  yq' | sha256sum --check
          chmod +x yq
          sudo mv yq /usr/local/bin/yq
      - name: chart renders and real offline BBOT collector fixture
        env:
          DECKARD_BBOT_FIXTURE: "1"
        run: zsh deploy/helm/tests/render_test.sh
      - name: replicated source health alert contracts
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m --entrypoint /bin/promtool \
            --mount "type=bind,src=$PWD/deploy/examples,dst=/rules,readonly" --workdir /rules \
            prom/prometheus@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64 \
            test rules prometheus-rules.test.yml
      - name: collector alert failure reasons and HA cardinality contracts
        run: zsh deploy/helm/tests/collector_alerts_test.sh

  runners:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: zgrab2
            dockerfile: deploy/assessment/Dockerfile.zgrab2
          - tool: zap
            dockerfile: deploy/assessment/Dockerfile.zap
          - tool: strix
            dockerfile: deploy/assessment/Dockerfile.strix
          - tool: trivy
            dockerfile: deploy/assessment/Dockerfile.trivy
          - tool: kubescape
            dockerfile: deploy/collectors/Dockerfile.kubescape
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build candidate with the current application
        if: matrix.tool != 'kubescape'
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          docker build --target slim -t deckard:runner-base .
          docker build -f "$DOCKERFILE" --build-arg DECKARD_IMAGE=deckard:runner-base -t deckard:runner-candidate .
      - name: build native Kubescape collector
        if: matrix.tool == 'kubescape'
        run: docker build -f deploy/collectors/Dockerfile.kubescape -t deckard:runner-candidate .
      - name: actual scanner interoperability and denied fixtures
        if: matrix.tool != 'trivy' && matrix.tool != 'kubescape'
        env:
          DECKARD_ASSESSMENT_NATIVE_INTEGRATION: "1"
          DECKARD_ASSESSMENT_NATIVE_TOOL: ${{ matrix.tool }}
          DECKARD_ASSESSMENT_ZGRAB2_IMAGE: deckard:runner-candidate
          DECKARD_ASSESSMENT_ZAP_IMAGE: deckard:runner-candidate
          DECKARD_ASSESSMENT_STRIX_IMAGE: deckard:runner-candidate
        run: go test -tags=live -count=1 -v ./internal/assessmentexec -run '^TestNativeAssessmentInteroperability$'
      - name: real Strix SDK and protocol contracts
        if: matrix.tool == 'strix'
        run: |
          docker run --rm --network none --user 65532:65532 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$PWD/deploy/assessment,dst=/tests,readonly" \
            --env STRIX_SECURITY_CHECK=1 --entrypoint /opt/venv/bin/python deckard:runner-candidate \
            -m unittest discover -s /tests/tests -p 'test_strix*.py' -v
      - name: actual ZGrab dependency metadata and license notices
        if: matrix.tool == 'zgrab2'
        env:
          ZGRAB_SECURITY_IMAGE: deckard:runner-candidate
          ZGRAB_LICENSE_IMAGE: deckard:runner-candidate
        run: |
          python3 -m unittest discover -s deploy/assessment/tests -p 'test_zgrab_security.py' -v
          python3 -m unittest discover -s deploy/assessment/tests -p 'test_runner_licenses.py' -v
      - name: targeted Trivy library fix and runtime security contracts
        if: matrix.tool == 'trivy'
        env:
          TRIVY_SECURITY_IMAGE: deckard:runner-candidate
        run: python3 -m unittest discover -s deploy/assessment/tests -p 'test_trivy_security.py' -v
      - name: actual Kubescape safety flags, offline frameworks, build metadata and notices
        if: matrix.tool == 'kubescape'
        env:
          KUBESCAPE_SECURITY_IMAGE: deckard:runner-candidate
        run: python3 -m unittest discover -s deploy/collectors/tests -p 'test_kubescape_security.py' -v
      - name: actual registry-only runtime image scan
        if: matrix.tool == 'trivy'
        run: |
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/deckard-trivy.XXXXXXXX")
          trap 'rmdir "$fixture_dir"' EXIT
          chmod 1777 "$fixture_dir"
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/imagecollector.test" ./internal/imagecollector
          docker run --rm --user 65532:65532 --read-only --cap-drop ALL --security-opt no-new-privileges --memory 2g \
            --mount "type=bind,src=$fixture_dir,dst=/tmp" \
            --mount "type=bind,src=$RUNNER_TEMP/imagecollector.test,dst=/fixture.test,readonly" \
            --env TRIVY_COLLECTOR_FIXTURE_TARGET=alpine@sha256:ae959799024a09da597284763c417a6e820e020fad0634c5267cf4f125e682bf \
            --entrypoint /fixture.test deckard:runner-candidate \
            -test.run '^TestNativePinnedTrivyFixture$' -test.v
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: deckard:runner-candidate
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [slim, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: docker build --target "$TARGET" -t "deckard:$TARGET" .
      - if: matrix.target == 'full'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: test finder pack and containment with the shipped nuclei binary
        if: matrix.target == 'full'
        shell: bash
        run: |
          container_id=$(docker create deckard:full)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/usr/local/bin/nuclei" /tmp/nuclei
          chmod +x /tmp/nuclei
          NUCLEI_SECURITY_BINARY=/tmp/nuclei python3 -m unittest discover -s deploy/assessment/tests -p 'test_nuclei_security.py' -v
          NUCLEI_BINARY=/tmp/nuclei go test -count=1 -v ./templates/deckard | tee finder-test.log
          if grep -q -- '--- SKIP' finder-test.log; then
            echo "finder template test skipped" >&2
            exit 1
          fi
          NUCLEI_BIN=/tmp/nuclei go test -tags=live -count=1 -v ./internal/nuclei -run '^TestLiveDestinationPolicy' | tee containment-test.log
          if grep -q -- '--- SKIP' containment-test.log; then
            echo "Nuclei containment test skipped" >&2
            exit 1
          fi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: deckard:${{ matrix.target }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # The official nuclei corpus intentionally contains public exploit
          # fixtures, default keys and secret-detection regex examples. Keep
          # secret scanning on for the image, but do not report its scanner
          # input data as Deckard credentials.
          skip-dirs: /usr/local/share/deckard/nuclei-templates
