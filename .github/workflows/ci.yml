name: ci
on:
  push: { branches: [main] }
  pull_request:

# Supersede in-flight runs for the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Reachable-vulnerability scanning (govulncheck) lives in govulncheck.yml, which
# also runs on every PR and daily; it is deliberately not duplicated here.

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt drift
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed on:" >&2; echo "$unformatted" >&2; exit 1; fi
      - name: go mod tidy drift
        run: go mod tidy -diff
      - run: go vet ./...
      # Postgres-backed tests use testcontainers (Docker is available on the runner).
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude-dir=web ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run typecheck && npm test && npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: helm lint deploy/helm/deckard --set database.cnpg.enabled=true
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: zsh deploy/helm/tests/render_test.sh

  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [slim, full]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: docker build --target "$TARGET" -t "deckard:$TARGET" .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: deckard:${{ matrix.target }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
