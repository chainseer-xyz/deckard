# Weekly dependency updates. Security updates are enabled repo-wide by default
# and ignore these schedules/limits. The nuclei engine version is not covered
# here (it is a Dockerfile ARG); .github/workflows/nuclei-bump.yml handles it.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message: { prefix: "build(deps)" }
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    commit-message: { prefix: "build(deps)" }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message: { prefix: "build(docker)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message: { prefix: "ci" }
    groups:
      actions:
        patterns: ["*"]
