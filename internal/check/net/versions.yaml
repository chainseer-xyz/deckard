# Banner patterns -> advisory text. Matched against "<banner> <server header>".
# Claims are deliberately modest: a banner may be spoofed or patched downstream
# (distros backport fixes without changing the version string).
- id: openssh-legacy
  match: '^SSH-2\.0-OpenSSH_([0-6]\.|7\.[0-3])'
  severity: low
  advisory: "banner indicates an OpenSSH release older than 7.4, which is long out of upstream support"
- id: sshd-protocol-1
  match: '^SSH-1\.'
  severity: medium
  advisory: "banner indicates SSH protocol 1 is accepted, which is cryptographically broken"
- id: vsftpd-234
  match: 'vsFTPd 2\.3\.4'
  severity: high
  advisory: "banner indicates vsftpd 2.3.4, a release that was distributed with a backdoor in 2011; verify the installed package"
- id: apache-22
  match: 'Apache/2\.2\.'
  severity: low
  advisory: "banner indicates Apache httpd 2.2.x, which is end of life"
- id: iis-legacy
  match: 'Microsoft-IIS/([1-7]\.)'
  severity: medium
  advisory: "banner indicates Microsoft IIS 7.x or older, which is end of life"
- id: php-5
  match: 'PHP/([1-5]\.)'
  severity: low
  advisory: "banner indicates PHP 5.x or older, which is end of life"
- id: openssl-10
  match: 'OpenSSL/(0\.|1\.0\.)'
  severity: low
  advisory: "banner indicates OpenSSL 1.0.x or older, which is end of life"
- id: nginx-legacy
  match: 'nginx/(0\.|1\.[0-9]\.|1\.1[0-5]\.)'
  severity: low
  advisory: "banner indicates an nginx release older than 1.16, which is long out of upstream support"
- id: elasticsearch-legacy
  match: '^elasticsearch (1|2|5)\.'
  severity: medium
  advisory: "banner indicates an Elasticsearch release that is end of life"
- id: proftpd-legacy
  match: 'ProFTPD 1\.[0-2]\.|ProFTPD 1\.3\.[0-3][a-z ]'
  severity: low
  advisory: "banner indicates an old ProFTPD 1.3.3 or earlier release"
