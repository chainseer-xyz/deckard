  #     tokenSecretRef: {name: bbot-discovery, key: token}
  #     source: bbot-external # must match a configured remote-only BBOT source
  #     targets: [example.com] # 1..16 explicit DNS names, not IPs/URLs/CIDRs
  #     modules: [crt, certspotter, hackertarget] # only these keyless passive modules
  #     # The real upstream SDK writes native NDJSON. Version-pinned guards disable
  #     # core dependency installation and use bundled PSL data. Only FINISHED scans
  #     # with successful provider responses produce uploadable output <=10MiB.
  #     # Fixed limits: 1200s, 512 provider requests, 10000 emitted events, 1 HTTP/s.
  #     # This does not provide a free global Internet index or prove ownership.
  #     # Keyless providers can restrict coverage; discovery always remains additive
  #     # and partial. Active/brute-force/internal HTTP extraction is disabled.
  #     # NetworkPolicy still requires explicit provider egress or a controlled CNI
  #     # FQDN policy. DNS A/AAAA resolution is retained, not an active service scan.
  #   - name: tetragon-events
  #     type: tetragon
  #     schedule: "*/5 * * * *"
  #     tokenSecretRef: {name: tetragon-ingest, key: token}
  #     sensorNamespace: tetragon
  #     sensorSelector: app.kubernetes.io/name=tetragon
  #     sensorContainer: export-stdout # fixed; never collect arbitrary agent logs
  #     clusterScope: k8s:uid:<kube-system-namespace-UID>
  #     # Uses collectors.ingest.image for both native scanner and uploader.
  #     # Requires an existing Tetragon sensor and JSON export-stdout container.
  #     # Installs no sensor, privileged DaemonSet, host mount or tracing policy.
