{{- $root := . -}}
{{- $collectors := .Values.collectors | default dict -}}
{{- if $collectors.enabled -}}
{{- range $job := $collectors.jobs -}}
{{- if and (ne (toString $job.enabled) "false") (eq $job.type "bbot") -}}
{{- $ctx := dict "root" $root "job" $job }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deckard.collectorName" $ctx }}
  labels: {{- include "deckard.collectorLabels" $ctx | nindent 4 }}
data:
  config.json: {{ dict "targets" $job.targets "modules" $job.modules | toJson | quote }}
  # The upstream CLI can exit zero after FAILED/ABORTED scans. Use its genuine
  # Python scanner and native NDJSON writer, then certify completion ourselves.
  # This narrow API hook is source-version pinned and tested with BBOT 3.0.2.
  collect.py: |-
    import asyncio
    import json
    import os
    from pathlib import Path

    import bbot
    import tldextract
    from bbot.modules.base import BaseModule
    from bbot.scanner import Scanner

    async def collect(request):
        if bbot.__version__ != "3.0.2":
            raise RuntimeError("unsupported BBOT version")
        # Use the pinned library's bundled PSL. Do not fetch mutable helper data.
        tldextract.extract = tldextract.TLDExtract(suffix_list_urls=())
        api_failed = False
        api_requests = 0
        original_request = BaseModule.api_request

        async def checked_request(module, *args, **kwargs):
            nonlocal api_failed, api_requests
            api_requests += 1
            if api_requests > 512:
                api_failed = True
                raise RuntimeError("provider request budget exceeded")
            response = await original_request(module, *args, **kwargs)
            if response is None or not module._api_response_is_success(response):
                api_failed = True
            return response

        BaseModule.api_request = checked_request
        scan = Scanner(
            *request["targets"],
            scan_name="collection",
            output_dir="/report",
            modules=request["modules"],
            output_modules=["json"],
            exclude_output_modules=["csv", "txt", "stdout"],
            require_flags=["passive"],
            exclude_modules=["speculate", "excavate", "cloudcheck", "unarchive", "aggregate"],
            config={
                "home": "/tmp/bbot",
                "deps": {"behavior": "disable"},
                "scope": {"search_distance": 0, "report_distance": 0},
                "dns": {"minimal": True, "wildcard_disable": True, "search_distance": 0,
                        "threads": 2, "timeout": 3, "retries": 0},
                "web": {"http_rate_limit": 1, "api_retries": 1, "http_retries": 0,
                        "http_timeout": 10, "http_timeout_infrastructure": 10,
                        "http_max_redirects": 0},
                "module_handle_event_timeout": 120,
                "file_blobs": False,
                "folder_blobs": False,
                "speculate": False,
                "excavate": False,
                "aggregate": False,
                "cloudcheck": False,
            },
        )
        # BBOT 3.0.2 calls this installer even with deps.behavior=disable.
        # These allowlisted Python modules require no external tools. Never
        # launch Ansible, sudo, package managers or helper downloads in this pod.
        async def no_install():
            pass

        scan.helpers.depsinstaller.install_core_deps = no_install
        try:
            async with asyncio.timeout(1200):
                events = 0
                async for event in scan.async_start():
                    events += 1
                    if events > 10000:
                        raise RuntimeError("event budget exceeded")
            if scan.status != "FINISHED" or scan.modules_status()["modules_errored"] or api_failed:
                raise RuntimeError("incomplete BBOT collection")
            if not set(request["modules"]).issubset(scan.modules):
                raise RuntimeError("requested module unavailable")
            report = Path("/report/collection/output.json")
            if not report.is_file() or not 0 < report.stat().st_size <= 10 * 1024 * 1024:
                raise RuntimeError("empty or oversized discovery report")
            os.replace(report, "/report/output.json")
        finally:
            BaseModule.api_request = original_request
            if scan.status != "FINISHED":
                await scan.async_stop()

    if __name__ == "__main__":
        asyncio.run(collect(json.loads(Path("/collector/config.json").read_text())))
{{- end -}}
{{- end -}}
{{- end -}}
