{{- $root := . -}}
{{- $collectors := .Values.collectors | default dict -}}
{{- if $collectors.enabled -}}
{{- range $job := $collectors.jobs -}}
{{- if and (ne (toString $job.enabled) "false") (eq $job.type "trivy-runtime") -}}
{{- $ctx := dict "root" $root "job" $job -}}
{{- $name := include "deckard.collectorName" $ctx }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-nodes
  labels: {{- include "deckard.collectorLabels" $ctx | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-nodes
  labels: {{- include "deckard.collectorLabels" $ctx | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}-nodes}
subjects: [{kind: ServiceAccount, name: {{ $name }}, namespace: {{ $root.Release.Namespace }}}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-pods
  labels: {{- include "deckard.collectorLabels" $ctx | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
{{- if $job.allNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-pods
  labels: {{- include "deckard.collectorLabels" $ctx | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}-pods}
subjects: [{kind: ServiceAccount, name: {{ $name }}, namespace: {{ $root.Release.Namespace }}}]
{{- else -}}
{{- range $namespace := $job.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-pods
  namespace: {{ $namespace | quote }}
  labels: {{- include "deckard.collectorLabels" $ctx | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}-pods}
subjects: [{kind: ServiceAccount, name: {{ $name }}, namespace: {{ $root.Release.Namespace }}}]
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
