apiVersion: v1
kind: Service
metadata:
  name: {{ include "deckard.fullname" . }}
  labels:
    {{- include "deckard.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
    - { name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics, protocol: TCP }
  selector:
    {{- include "deckard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- if .Values.worker.enabled }}
---
# Headless Service so Prometheus can scrape every worker pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "deckard.fullname" . }}-worker
  labels:
    {{- include "deckard.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  ports:
    - { name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics, protocol: TCP }
  selector:
    {{- include "deckard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
