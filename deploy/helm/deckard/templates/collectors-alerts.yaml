{{- $root := . -}}
{{- $collectors := .Values.collectors | default dict -}}
{{- $alerts := $collectors.alerts | default dict -}}
{{- if and $collectors.enabled $alerts.enabled $collectors.jobs }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "deckard.fullname" . }}-collectors
  labels:
    {{- include "deckard.labels" . | nindent 4 }}
    {{- with $alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: deckard-collectors
      rules:
        {{- range $job := $collectors.jobs }}
        {{- if ne (toString $job.enabled) "false" }}
        {{- $name := include "deckard.collectorName" (dict "root" $root "job" $job) }}
        - alert: DeckardCollectorStale
          # Job success includes a successful Deckard ingest. A failed scanner,
          # report guard or upload cannot advance this heartbeat. Requires KSM.
          expr: >-
            (time() - (max(kube_cronjob_status_last_successful_time{namespace={{ $root.Release.Namespace | quote }},cronjob={{ $name | quote }}})
            or max(kube_cronjob_created{namespace={{ $root.Release.Namespace | quote }},cronjob={{ $name | quote }}})))
            > {{ default (default 172800 $alerts.maxAgeSeconds) $job.maxAgeSeconds }}
            and on() max(kube_cronjob_spec_suspend{namespace={{ $root.Release.Namespace | quote }},cronjob={{ $name | quote }}}) == 0
          for: 15m
          labels: {severity: warning, namespace: {{ $root.Release.Namespace | quote }}, collector: {{ $job.name | quote }}}
          annotations:
            summary: {{ printf "Deckard collector %s has no recent successful ingest" $job.name | quote }}
            description: {{ printf "No accepted upload within %v seconds. Schedule: %s. Check the collector Pods and scanner/ingest logs. Existing findings remain stored; this alert does not assert remediation or complete coverage." (default (default 172800 $alerts.maxAgeSeconds) $job.maxAgeSeconds) $job.schedule | quote }}
            diagnostic_command: {{ printf "kubectl -n %s get pods -l deckard.io/collector=%s" $root.Release.Namespace $job.name | quote }}
            runbook_url: "https://github.com/chainseer-xyz/deckard/blob/main/docs/collectors.md#collector-failures"
        - alert: DeckardCollectorFailed
          # KSM emits one failed series per reason, including zero-valued
          # reasons. Deduplicate reasons and scrape replicas before joining.
          # Retain an idle unsuccessful schedule after Job TTL cleanup. Missing
          # active/suspend metrics cannot establish this fallback's state.
          expr: >-
            (max(max by(namespace,job_name) (kube_job_created{namespace={{ $root.Release.Namespace | quote }}})
            * on(namespace,job_name) (max by(namespace,job_name) (kube_job_status_failed{namespace={{ $root.Release.Namespace | quote }}}) > bool 0)
            * on(namespace,job_name) max by(namespace,job_name) (kube_job_owner{namespace={{ $root.Release.Namespace | quote }},owner_kind="CronJob",owner_name={{ $name | quote }}}))
            > (max(kube_cronjob_status_last_successful_time{namespace={{ $root.Release.Namespace | quote }},cronjob={{ $name | quote }}}) or vector(0)))
            or
            (max(kube_cronjob_status_last_schedule_time{namespace={{ $root.Release.Namespace | quote }},cronjob={{ $name | quote }}})
            > (max(kube_cronjob_status_last_successful_time{namespace={{ $root.Release.Namespace | quote }},cronjob={{ $name | quote }}}) or vector(0))
            and on() max(kube_cronjob_status_active{namespace={{ $root.Release.Namespace | quote }},cronjob={{ $name | quote }}}) == 0
            and on() max(kube_cronjob_spec_suspend{namespace={{ $root.Release.Namespace | quote }},cronjob={{ $name | quote }}}) == 0)
          for: 5m
          labels: {severity: warning, namespace: {{ $root.Release.Namespace | quote }}, collector: {{ $job.name | quote }}}
          annotations:
            summary: {{ printf "Deckard collector %s failed after its last successful ingest" $job.name | quote }}
            description: "A scanner or upload failed. Inspect scanner logs first, then ingest logs if scanning succeeded. No accepted report from that run; report delivery does not prove complete coverage."
            diagnostic_command: {{ printf "kubectl -n %s get pods -l deckard.io/collector=%s" $root.Release.Namespace $job.name | quote }}
            runbook_url: "https://github.com/chainseer-xyz/deckard/blob/main/docs/collectors.md#collector-failures"
        {{- end }}
        {{- end }}
{{- end }}
