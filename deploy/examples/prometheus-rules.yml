# Prometheus alerting rules for deckard's own operational health (not findings;
# those go to Alertmanager directly). Metric names come from design spec s10.
groups:
  - name: deckard-health
    rules:
      - alert: DeckardSourceSyncStale
        expr: time() - deckard_source_last_success_timestamp > 3600
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "deckard source {{ $labels.source }} has not synced for over an hour"
          description: "Inventory from {{ $labels.source }} is stale, so new assets are not being scanned."

      - alert: DeckardSourceNeverSynced
        expr: deckard_source_last_success_timestamp == 0
        for: 30m
        labels:
          severity: medium
        annotations:
          summary: "deckard source {{ $labels.source }} has never synced successfully"

      - alert: DeckardScanErrorRateHigh
        expr: sum by (check) (rate(deckard_scan_errors_total[15m])) > 0.1
        for: 15m
        labels:
          severity: medium
        annotations:
          summary: "deckard check {{ $labels.check }} is erroring"
          description: "{{ $value | humanize }} errors/s over 15m."

      - alert: DeckardScanErrorRatio
        expr: |
          sum by (check) (rate(deckard_scan_errors_total[30m]))
            / clamp_min(sum by (check) (rate(deckard_checks_run_total[30m])), 1e-9) > 0.25
        for: 30m
        labels:
          severity: medium
        annotations:
          summary: "More than 25% of {{ $labels.check }} runs are failing"

      - alert: DeckardQueueBacklog
        expr: deckard_queue_depth > 1000
        for: 15m
        labels:
          severity: medium
        annotations:
          summary: "deckard queue {{ $labels.queue }} backlog is {{ $value }}"
          description: "Workers are not keeping up; check worker replicas and rate limits."

      - alert: DeckardQueueStuck
        expr: sum(deckard_queue_depth) > 0 and on() sum(increase(deckard_checks_run_total[1h])) == 0
        for: 1h
        labels:
          severity: high
        annotations:
          summary: "deckard queue is non-empty but no checks have run in an hour"

      # Reference data refresh (takeover fingerprints, shared ranges). Alerts use
      # the default refdata.interval of 24h: "stale" is more than three intervals.
      # Air-gapped deployments set refdata.enabled=false and never see these series.
      - alert: DeckardRefdataStale
        expr: deckard_refdata_age_seconds > 3 * 86400
        for: 30m
        labels:
          severity: medium
        annotations:
          summary: "deckard reference data {{ $labels.dataset }} has not been refreshed for over 3 days"
          description: "Running on the last good or embedded copy. Check egress to the dataset sources and deckard_refdata_refresh_total{result=~\"error|rejected\"}; adjust the threshold if you changed refdata.interval."

      - alert: DeckardRefdataRejected
        expr: increase(deckard_refdata_refresh_total{result="rejected"}[3d]) >= 2
        labels:
          severity: medium
        annotations:
          summary: "deckard keeps rejecting the {{ $labels.dataset }} download"
          description: "The published data failed validation (parse error, too small, or shrank by more than 50%), so the previous copy stays in use. Inspect the upstream source; a persistent reject may mean its format changed."

      - alert: DeckardRefdataRefreshFailing
        expr: increase(deckard_refdata_refresh_total{result="error"}[1d]) > 3 unless on(dataset) increase(deckard_refdata_refresh_total{result=~"ok|unchanged"}[1d]) > 0
        for: 1h
        labels:
          severity: low
        annotations:
          summary: "deckard cannot download {{ $labels.dataset }}"
          description: "Every refresh in the last day failed. Check egress/proxy rules."

      # Only exists when notify.heartbeat.url is set (the series is absent
      # otherwise). The external monitor is the real dead-man's switch; this is
      # the in-cluster view of the same signal: no successful ping in 30m.
      - alert: DeckardHeartbeatFailing
        expr: |
          sum(increase(deckard_heartbeat_total{result=~"error|unhealthy"}[30m])) > 0
            unless on() sum(increase(deckard_heartbeat_total{result="ok"}[30m])) > 0
        labels:
          severity: high
        annotations:
          summary: "deckard has not sent a successful heartbeat for 30 minutes"
          description: "Results are error (the ping failed: check egress to the heartbeat URL) or unhealthy (withheld: the database is unreachable or no check completed within two heartbeat intervals). See the deckard logs for the reason."

      # A reclaim means an instance died without a graceful stop (OOMKilled,
      # SIGKILL, node loss) while running jobs. The jobs recover by themselves;
      # the crash deserves a look. The series exist at 0 from engine start, but
      # a replacement pod reclaims at startup, possibly before its first scrape:
      # increase() cannot see a series' first value, so the second branch
      # catches a series that is new within the hour and already non-zero.
      - alert: DeckardJobsReclaimed
        expr: |
          sum by (kind) (increase(deckard_jobs_reclaimed_total[1h])) > 0
            or
          sum by (kind) (deckard_jobs_reclaimed_total unless deckard_jobs_reclaimed_total offset 1h) > 0
        labels:
          severity: medium
        annotations:
          summary: "deckard reclaimed {{ $value | humanize }} running {{ $labels.kind }} job(s) from a dead instance"
          description: "An instance stopped heartbeating while running jobs; a peer moved them back to the queue. Look for an OOMKill or a forced restart (kubectl get pods, kubectl describe pod: Last State). See docs/operations.md, Crashes, restarts and orphaned jobs."

      - alert: DeckardDown
        expr: absent(up{job="deckard"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "deckard is down or not being scraped"

  - name: deckard-nuclei-templates
    rules:
      # The threshold is nuclei.update.max_age_warn (default 72h), exported by
      # deckard itself. The age counts from the last time the updater confirmed
      # the templates current, so a quiet upstream does not trigger it: only a
      # broken updater does.
      - alert: DeckardNucleiTemplatesStale
        expr: deckard_nuclei_templates_age_seconds > on() deckard_nuclei_templates_max_age_warn_seconds
        for: 15m
        labels:
          severity: high
        annotations:
          summary: "deckard's nuclei templates have not been refreshed for {{ $value | humanizeDuration }}"
          description: "New CVE templates are not being fetched, so new vulnerabilities (for example the next React2Shell) will not be tested. Check the update_templates job, the nuclei.update.dir volume and egress to github.com."

      - alert: DeckardNucleiTemplateUpdatesFailing
        expr: increase(deckard_nuclei_template_updates_total{result="error"}[6h]) >= 3 and on() sum(increase(deckard_nuclei_template_updates_total{result=~"ok|unchanged"}[6h])) == 0
        for: 30m
        labels:
          severity: medium
        annotations:
          summary: "deckard's nuclei template updates keep failing"
          description: "{{ $value | humanize }} failed updates in 6h and none succeeded. deckard keeps scanning with the last good templates; check egress to github.com and the nuclei.update.dir volume."

      # Only meaningful when the updater runs on this deployment: the series does
      # not exist when nuclei.update.enabled is false (air-gapped installs).
      - alert: DeckardNucleiTemplatesNeverLoaded
        expr: deckard_nuclei_template_updates_total{result="error"} > 0 and on() absent(deckard_nuclei_template_count)
        for: 1h
        labels:
          severity: high
        annotations:
          summary: "deckard has never installed nuclei templates"
          description: "cve.nuclei cannot run until the first template update succeeds."

  - name: deckard-intel
    rules:
      # The metadata client refused a request before connecting: a host off the
      # allow-list, a redirect to one, or a name resolving to a private or
      # metadata address. Never expected in normal operation.
      - alert: DeckardIntelRequestBlocked
        expr: sum by (service) (increase(deckard_intel_requests_total{result="blocked"}[1h])) > 0
        labels:
          severity: medium
        annotations:
          summary: "deckard refused {{ $value }} {{ $labels.service }} metadata request(s)"
          description: "The intel client blocked requests it should never have been asked to make. Check the WARN log lines \"intel: request blocked\" for the host and reason."

  - name: deckard-vulnintel
    rules:
      # Ages are relative to the last successful fetch. The threshold (18h) is 3x
      # the default vulnintel.interval of 6h: tune it if you changed the interval.
      # Air-gapped deployments (vulnintel.enabled=false) never export these series.
      - alert: DeckardVulnintelFeedStale
        expr: deckard_vulnintel_age_seconds > 3 * 6 * 3600
        for: 30m
        labels:
          severity: medium
        annotations:
          summary: "deckard {{ $labels.feed }} exploit-intelligence feed is stale"
          description: "No successful {{ $labels.feed }} fetch for {{ $value | humanizeDuration }}. Findings keep using the last good copy, but new KEV additions are not being noticed. Air-gapped? Set vulnintel.enabled: false."

      - alert: DeckardVulnintelRefreshFailing
        expr: sum by (feed) (increase(deckard_vulnintel_refresh_total{result="error"}[6h])) >= 3
        for: 10m
        labels:
          severity: medium
        annotations:
          summary: "deckard {{ $labels.feed }} feed refresh keeps failing"
          description: "{{ $value }} failed refreshes in 6h. Check egress to www.cisa.gov / api.first.org and the deckard logs."

      - alert: DeckardVulnintelNeverLoaded
        expr: deckard_vulnintel_kev_entries == 0 and on() deckard_vulnintel_refresh_total{feed="kev"} > 0
        for: 1h
        labels:
          severity: medium
        annotations:
          summary: "deckard has no CISA KEV data despite refresh attempts"

      # Informational: open findings whose CVE is in CISA KEV.
      - alert: DeckardKnownExploitedOpen
        expr: deckard_findings_kev_open > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "{{ $value }} open deckard finding(s) are known-exploited (CISA KEV)"

  # Findings posted by external scanners through POST /api/v1/ingest (see
  # docs/ingest.md). Every deckard replica exports the same store-backed values,
  # so the expressions aggregate before comparing.
  - name: deckard-ingest
    rules:
      # Only tools with ingest.tools.<tool>.expected_interval export
      # deckard_ingest_expected_interval_seconds, so only they can go stale, and
      # only scopes that completed at least once have a timestamp. "Complete"
      # means a request with complete: true that was applied as complete. A
      # retired scope keeps firing until silenced.
      - alert: DeckardIngestStale
        expr: |
          min by (tool, scope) (time() - deckard_ingest_last_success_timestamp)
            > on (tool) group_left ()
          2 * max by (tool) (deckard_ingest_expected_interval_seconds)
        for: 15m
        labels:
          severity: medium
        annotations:
          summary: "No complete {{ $labels.tool }} ingest for {{ $labels.scope }} in over twice its expected interval"
          description: "The last complete run was {{ $value | humanizeDuration }} ago, so findings for this scope are neither refreshed nor resolved. Check the producer (CronJob or CI job) and deckard_ingest_requests_total{tool=\"{{ $labels.tool }}\"}; scope=\"other\" aggregates the scopes beyond ingest.max_scopes_per_tool (oldest wins)."

      # rejected (422), invalid (400/415) and too_large (413) changed nothing.
      # partial was applied but some items were rejected (an asset.ref that is
      # not a live owned asset) or the run was not newer than the last accepted
      # one, so nothing was resolved by it.
      - alert: DeckardIngestRejected
        expr: sum by (tool, result) (increase(deckard_ingest_requests_total{result=~"rejected|invalid|too_large|partial"}[1h])) > 0
        labels:
          severity: medium
        annotations:
          summary: "deckard answered {{ $value | humanize }} {{ $labels.tool }} ingest request(s) with result {{ $labels.result }} in the last hour"
          description: "The response body lists every problem (rejected[].reason) and the deckard log has a line per request (msg=\"ingest applied\" or the access log). A persistently rejected producer is also a stale one: its findings no longer resolve."
