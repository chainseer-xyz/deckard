rule_files: [prometheus-rules.yml]
evaluation_interval: 1m
tests:
  - name: expansion and housekeeping queues do not require native scan progress
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="expand"}
        values: 53+0x180
      - series: deckard_queue_depth{queue="default"}
        values: 5+0x180
      - series: deckard_queue_depth{queue="sync"}
        values: 2+0x180
      - series: deckard_queue_depth{queue="passive-extra"}
        values: 1+0x180
      - series: deckard_checks_run_total{check="http.headers",tier="passive"}
        values: 5+0x180
    alert_rule_test:
      - eval_time: 120m
        alertname: DeckardQueueStuck
        exp_alerts: []

  - name: housekeeping without any native check counters is not a stalled scan queue
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="expand"}
        values: 53+0x180
    alert_rule_test:
      - eval_time: 120m
        alertname: DeckardQueueStuck
        exp_alerts: []

  - name: passive scans stalled before their first execution alert after the hold
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="passive"}
        values: 1+0x180
    alert_rule_test:
      - eval_time: 59m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 60m
        alertname: DeckardQueueStuck
        exp_alerts: &queue_stuck
          - exp_labels: {severity: high}
            exp_annotations:
              summary: deckard queue is non-empty but no checks have run in an hour

  - name: active scans stalled before their first execution alert after the hold
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="active"}
        values: 1+0x180
    alert_rule_test:
      - eval_time: 59m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 60m
        alertname: DeckardQueueStuck
        exp_alerts: *queue_stuck

  - name: intrusive scans stalled before their first execution alert after the hold
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="intrusive"}
        values: 1+0x180
    alert_rule_test:
      - eval_time: 59m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 60m
        alertname: DeckardQueueStuck
        exp_alerts: *queue_stuck

  - name: intel scans stalled before their first execution alert after the hold
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="intel"}
        values: 1+0x180
    alert_rule_test:
      - eval_time: 59m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 60m
        alertname: DeckardQueueStuck
        exp_alerts: *queue_stuck

  - name: passive scan backlog with a flat established counter still alerts
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="passive"}
        values: 0+0x59 1+0x121
      - series: deckard_checks_run_total{check="http.headers",tier="passive"}
        values: 5+0x180
    alert_rule_test:
      - eval_time: 119m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 120m
        alertname: DeckardQueueStuck
        exp_alerts: *queue_stuck

  - name: active scan backlog with a flat established counter still alerts
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="active"}
        values: 0+0x59 1+0x121
      - series: deckard_checks_run_total{check="http.headers",tier="passive"}
        values: 5+0x180
    alert_rule_test:
      - eval_time: 119m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 120m
        alertname: DeckardQueueStuck
        exp_alerts: *queue_stuck

  - name: intrusive scan backlog with a flat established counter still alerts
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="intrusive"}
        values: 0+0x59 1+0x121
      - series: deckard_checks_run_total{check="http.headers",tier="passive"}
        values: 5+0x180
    alert_rule_test:
      - eval_time: 119m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 120m
        alertname: DeckardQueueStuck
        exp_alerts: *queue_stuck

  - name: intel scan backlog with a flat established counter still alerts
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="intel"}
        values: 0+0x59 1+0x121
      - series: deckard_checks_run_total{check="http.headers",tier="passive"}
        values: 5+0x180
    alert_rule_test:
      - eval_time: 119m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 120m
        alertname: DeckardQueueStuck
        exp_alerts: *queue_stuck

  - name: native scan progress prevents a stuck alert despite queued scans
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="passive"}
        values: 1+0x240
      - series: deckard_checks_run_total{check="http.headers",tier="passive"}
        values: 1+1x240
    alert_rule_test:
      - eval_time: 180m
        alertname: DeckardQueueStuck
        exp_alerts: []

  - name: a late first counter sampled at one resets the full stuck hold
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="passive"}
        values: 1+0x240
      - series: deckard_checks_run_total{check="http.headers",tier="passive"}
        values: _x90 1+0x150
    alert_rule_test:
      - eval_time: 60m
        alertname: DeckardQueueStuck
        exp_alerts: *queue_stuck
      - eval_time: 90m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 180m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 209m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 210m
        alertname: DeckardQueueStuck
        exp_alerts: *queue_stuck

  - name: resetting an established counter to zero is not execution evidence
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="passive"}
        values: 0+0x59 1+0x181
      - series: deckard_checks_run_total{check="http.headers",tier="passive"}
        values: 10+0x89 0+0x151
    alert_rule_test:
      - eval_time: 119m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 120m
        alertname: DeckardQueueStuck
        exp_alerts: *queue_stuck

  - name: replacement replica first sampled at one is real execution evidence
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="intel",instance="api"}
        values: 0+0x59 1+0x181
      - series: deckard_checks_run_total{check="domain.expiry",tier="passive",instance="old"}
        values: 10+0x89 stale
      - series: deckard_checks_run_total{check="domain.expiry",tier="passive",instance="new"}
        values: _x90 1+0x150
    alert_rule_test:
      - eval_time: 120m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 180m
        alertname: DeckardQueueStuck
        exp_alerts: []
      - eval_time: 210m
        alertname: DeckardQueueStuck
        exp_alerts: *queue_stuck

  - name: actual progress after a counter reset still prevents a stuck alert
    interval: 1m
    input_series:
      - series: deckard_queue_depth{queue="passive"}
        values: 0+0x59 1+0x181
      - series: deckard_checks_run_total{check="http.headers",tier="passive",instance="worker"}
        values: 10+0x89 0+0x9 1+1x140
    alert_rule_test:
      - eval_time: 180m
        alertname: DeckardQueueStuck
        exp_alerts: []

  - name: missing queue metrics do not assert a backlog
    interval: 1m
    input_series:
      - series: deckard_checks_run_total{check="http.headers",tier="passive"}
        values: 5+0x180
    alert_rule_test:
      - eval_time: 120m
        alertname: DeckardQueueStuck
        exp_alerts: []

  - name: no metrics do not assert a stalled scan queue
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 120m
        alertname: DeckardQueueStuck
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: deckard_source_last_success_timestamp{source="native",instance="api"}
        values: 1+0x120
      - series: deckard_source_last_success_timestamp{source="native",instance="worker"}
        values: 1+0x120
      - series: deckard_source_expected_interval_seconds{source="native",instance="api"}
        values: 600+0x120
      - series: deckard_source_expected_interval_seconds{source="native",instance="worker"}
        values: 600+0x120
      - series: deckard_source_last_success_timestamp{source="recon",instance="api"}
        values: 1+0x120
      - series: deckard_source_last_success_timestamp{source="recon",instance="worker"}
        values: 1+0x120
      - series: deckard_source_expected_interval_seconds{source="recon",instance="api"}
        values: 21600+0x120
      - series: deckard_source_expected_interval_seconds{source="recon",instance="worker"}
        values: 21600+0x120
      - series: deckard_source_expected_interval_seconds{source="unseen",instance="api"}
        values: 600+0x120
      - series: deckard_source_expected_interval_seconds{source="unseen",instance="worker"}
        values: 600+0x120
    alert_rule_test:
      - eval_time: 60m
        alertname: DeckardSourceSyncStale
        exp_alerts:
          - exp_labels: {source: native, severity: high}
            exp_annotations:
              summary: deckard source native missed three configured sync or report intervals
              description: Inventory from native is stale, so new assets are not being scanned.
      - eval_time: 31m
        alertname: DeckardSourceNeverSynced
        exp_alerts:
          - exp_labels: {source: unseen, severity: medium}
            exp_annotations:
              summary: deckard source unseen has never synced successfully

  - name: stale worker is not hidden by a fresh API replica
    interval: 1m
    input_series:
      - series: deckard_nuclei_templates_age_seconds{job="deckard",instance="api"}
        values: 1800+0x40
      - series: deckard_nuclei_templates_age_seconds{job="deckard",instance="worker"}
        values: 7200+0x40
      - series: deckard_nuclei_templates_max_age_warn_seconds{job="deckard",instance="api"}
        values: 3600+0x40
      - series: deckard_nuclei_templates_max_age_warn_seconds{job="deckard",instance="worker"}
        values: 3600+0x40
    alert_rule_test:
      - eval_time: 10m
        alertname: DeckardNucleiTemplatesStale
        exp_alerts: []
      - eval_time: 16m
        alertname: DeckardNucleiTemplatesStale
        exp_alerts:
          - exp_labels: {job: deckard, instance: worker, severity: high}
            exp_annotations: &nuclei_stale_2h
              summary: deckard's nuclei templates have not been refreshed for 2h 0m 0s
              description: "New CVE templates are not being fetched, so new vulnerabilities (for example the next React2Shell) will not be tested. Check the update_templates job, the nuclei.update.dir volume and egress to github.com."

  - name: each replica uses its own configured template threshold
    interval: 1m
    input_series:
      - series: deckard_nuclei_templates_age_seconds{job="deckard",instance="api"}
        values: 7200+0x40
      - series: deckard_nuclei_templates_age_seconds{job="deckard",instance="worker"}
        values: 7200+0x40
      - series: deckard_nuclei_templates_max_age_warn_seconds{job="deckard",instance="api"}
        values: 3600+0x40
      - series: deckard_nuclei_templates_max_age_warn_seconds{job="deckard",instance="worker"}
        values: 10800+0x40
    alert_rule_test:
      - eval_time: 16m
        alertname: DeckardNucleiTemplatesStale
        exp_alerts:
          - exp_labels: {job: deckard, instance: api, severity: high}
            exp_annotations: *nuclei_stale_2h

  - name: both stale replicas alert independently
    interval: 1m
    input_series:
      - series: deckard_nuclei_templates_age_seconds{job="deckard",instance="api"}
        values: 7200+0x40
      - series: deckard_nuclei_templates_age_seconds{job="deckard",instance="worker"}
        values: 7200+0x40
      - series: deckard_nuclei_templates_max_age_warn_seconds{job="deckard",instance="api"}
        values: 3600+0x40
      - series: deckard_nuclei_templates_max_age_warn_seconds{job="deckard",instance="worker"}
        values: 3600+0x40
    alert_rule_test:
      - eval_time: 16m
        alertname: DeckardNucleiTemplatesStale
        exp_alerts:
          - exp_labels: {job: deckard, instance: api, severity: high}
            exp_annotations: *nuclei_stale_2h
          - exp_labels: {job: deckard, instance: worker, severity: high}
            exp_annotations: *nuclei_stale_2h

  - name: threshold-only replica cannot break another replica's age alert
    interval: 1m
    input_series:
      - series: deckard_nuclei_templates_age_seconds{job="deckard",instance="worker"}
        values: 7200+0x40
      - series: deckard_nuclei_templates_max_age_warn_seconds{job="deckard",instance="api"}
        values: 3600+0x40
      - series: deckard_nuclei_templates_max_age_warn_seconds{job="deckard",instance="worker"}
        values: 3600+0x40
    alert_rule_test:
      - eval_time: 16m
        alertname: DeckardNucleiTemplatesStale
        exp_alerts:
          - exp_labels: {job: deckard, instance: worker, severity: high}
            exp_annotations: *nuclei_stale_2h

  - name: absent template age and exact threshold do not assert stale templates
    interval: 1m
    input_series:
      - series: deckard_nuclei_templates_age_seconds{job="deckard",instance="worker"}
        values: 3600+0x40
      - series: deckard_nuclei_templates_max_age_warn_seconds{job="deckard",instance="api"}
        values: 3600+0x40
      - series: deckard_nuclei_templates_max_age_warn_seconds{job="deckard",instance="worker"}
        values: 3600+0x40
    alert_rule_test:
      - eval_time: 16m
        alertname: DeckardNucleiTemplatesStale
        exp_alerts: []

  - name: on-demand EPSS inactivity is not a stale scheduled feed
    interval: 1m
    input_series:
      - series: deckard_vulnintel_age_seconds{feed="epss"}
        values: 400000+0x90
      - series: deckard_vulnintel_age_seconds{feed="kev"}
        values: 3600+0x90
    alert_rule_test:
      - eval_time: 60m
        alertname: DeckardVulnintelFeedStale
        exp_alerts: []

  - name: scheduled KEV refresh still alerts after its stale hold
    interval: 1m
    input_series:
      - series: deckard_vulnintel_age_seconds{feed="kev"}
        values: 72000+0x90
    alert_rule_test:
      - eval_time: 20m
        alertname: DeckardVulnintelFeedStale
        exp_alerts: []
      - eval_time: 31m
        alertname: DeckardVulnintelFeedStale
        exp_alerts:
          - exp_labels: {feed: kev, severity: medium}
            exp_annotations:
              summary: deckard kev exploit-intelligence feed is stale
              description: "No successful kev fetch for 20h 0m 0s. Findings keep using the last good copy, but new KEV additions are not being noticed. Air-gapped? Set vulnintel.enabled: false."

  - name: actual EPSS and KEV refresh errors both remain actionable
    interval: 1m
    input_series:
      - series: deckard_vulnintel_refresh_total{feed="epss",result="error"}
        values: 0+0x10 3+0x60
      - series: deckard_vulnintel_refresh_total{feed="kev",result="error"}
        values: 0+0x10 3+0x60
    alert_rule_test:
      - eval_time: 30m
        alertname: DeckardVulnintelRefreshFailing
        exp_alerts:
          - exp_labels: {feed: epss, severity: medium}
            exp_annotations:
              summary: deckard epss feed refresh keeps failing
              description: "3 failed refreshes in 6h. Check egress to www.cisa.gov / api.first.org and the deckard logs."
          - exp_labels: {feed: kev, severity: medium}
            exp_annotations:
              summary: deckard kev feed refresh keeps failing
              description: "3 failed refreshes in 6h. Check egress to www.cisa.gov / api.first.org and the deckard logs."
