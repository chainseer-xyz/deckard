id: deckard-cors-credentials-reflection
info:
  name: Credentialed arbitrary-origin CORS
  author: deckard
  severity: high
  tags: [deckard, exposure, cors]
  description: The service reflects an arbitrary Origin while allowing credentials.
  remediation: Allow only an explicit origin allowlist and never combine arbitrary origin reflection with credentials.
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    headers:
      Origin: https://untrusted.example
    matchers:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-origin:\\s*https://untrusted\\.example"
          - "(?i)access-control-allow-credentials:\\s*true"
        condition: and
